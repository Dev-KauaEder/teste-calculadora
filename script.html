<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- Visor onde os números aparecem -->
        <div class="display" id="display">0</div>

        <!-- Grade de botões -->
        <div class="buttons">
            <button class="btn btn-clear">C</button>
            <button class="btn btn-operator">±</button>
            <button class="btn btn-operator">%</button>
            <button class="btn btn-operator">÷</button>
            
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn btn-operator">×</button>
            
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn btn-operator">-</button>
            
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn btn-operator">+</button>
            
            <button class="btn btn-zero">0</button>
            <button class="btn">.</button>
            <button class="btn btn-equals">=</button>
        </div>
    </div>

    <script src="script.js">

const display = document.getElementById('display');
const buttons = document.querySelectorAll('.btn');


let currentInput = '0'; 
let previousInput = '';
let operator = null;   


function updateDisplay() {
    
    if (currentInput.length > 12) {
        display.innerText = currentInput.substring(0, 12);
    } else {
        display.innerText = currentInput;
    }
}

function calculate() {
    let result;
    const prev = parseFloat(previousInput);
    const current = parseFloat(currentInput);

    if (isNaN(prev) || isNaN(current)) return;

    switch (operator) {
        case '+':
            result = prev + current;
            break;
        case '-':
            result = prev - current;
            break;
        case '×':
            result = prev * current;
            break;
        case '÷':
            if (current === 0) {
                currentInput = 'Erro';
                updateDisplay();
                return;
            }
            result = prev / current;
            break;
        default:
            return;
    }
    

    currentInput = result.toString();
    operator = null;
    previousInput = '';
}


buttons.forEach(button => {
    button.addEventListener('click', () => {
        const value = button.innerText;


        if (value === 'C') {
            currentInput = '0';
            previousInput = '';
            operator = null;
            updateDisplay();
            return;
        }

        if (value === '±') {
            currentInput = (parseFloat(currentInput) * -1).toString();
            updateDisplay();
            return;
        }

        if (value === '%') {
            currentInput = (parseFloat(currentInput) / 100).toString();
            updateDisplay();
            return;
        }

        if (value === '+' || value === '-' || value === '×' || value === '÷') {
            if (operator !== null) {
                calculate();
            }
            previousInput = currentInput;
            operator = value;
            currentInput = '0'; 
            return;
        }

        if (value === '=') {
            if (operator !== null) {
                calculate();
                updateDisplay();
            }
            return;
        }

        if (currentInput === '0' && value !== '.') {
            currentInput = value;
        } else {
            if (value === '.' && currentInput.includes('.')) return;
            currentInput += value;
        }
        
        updateDisplay();
    });
})
    </script>
</body>
</html>
